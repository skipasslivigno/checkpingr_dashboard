openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Ski Area Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: lifts
    description: Lift passage operations
  - name: dashboard
    description: Dashboard summary operations
  - name: settings
    description: Tenant settings operations
  - name: users
    description: User management operations (admin only)
paths:
  /email/settings:
    get:
      operationId: getEmailSettings
      tags: [users]
      summary: Current administrator's Gmail settings, without secrets
      responses:
        "200":
          description: Personal settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailSettings" }
    put:
      operationId: saveEmailSettings
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailSettingsInput" }
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailSettings" }
    delete:
      operationId: deleteEmailSettings
      tags: [users]
      responses:
        "204": { description: Personal Gmail configuration removed }
  /email/test:
    post:
      operationId: sendTestEmail
      tags: [users]
      summary: Send a test message only to the current administrator
      responses:
        "200":
          description: Accepted by Gmail SMTP, not a delivery guarantee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailReceipt" }
  /email/preview:
    post:
      operationId: previewCredentialEmail
      tags: [users]
      summary: Preview a draft with an example password, without sending
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailPreviewInput" }
      responses:
        "200":
          description: Rendered preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailPreview" }
  /users/{id}/send-credentials:
    post:
      operationId: sendUserCredentials
      tags: [users]
      summary: Send a new temporary password and require a password change
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialEmailInput" }
      responses:
        "200":
          description: Accepted by Gmail and password updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailReceipt" }
        "400": { description: Missing confirmation or invalid configuration }
        "404": { description: User not found in current tenant }
        "409": { description: Recipient changed or inactive }
        "429": { description: Wait before sending again }
        "502": { description: Gmail could not confirm sending; password unchanged }
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get the authenticated user's current account state
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [users]
      summary: Change own password and clear the required-change flag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeOwnPasswordRequest"
      responses:
        "200":
          description: Replacement session after password change
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid password or password reuse
        "401":
          description: Invalid session or current password
        "409":
          description: Account changed concurrently; sign in again
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get tenant settings
      description: Returns the current tenant's configuration settings
      responses:
        "200":
          description: Tenant settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update tenant settings (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSettings"

  /settings/season-starts:
    get:
      operationId: getSeasonStarts
      tags: [settings]
      summary: List seasons and their configured opening dates for the current tenant
      responses:
        "200":
          description: Configured and available seasons, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SeasonStart" }

  /settings/season-starts/{season}:
    put:
      operationId: updateSeasonStart
      tags: [settings]
      summary: Set or clear a season opening date (admin only)
      parameters:
        - name: season
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 40 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeasonStartInput" }
      responses:
        "200":
          description: Saved season opening date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonStart" }
        "400":
          description: Invalid season or calendar date
        "403":
          description: Administrator required
        "404":
          description: Season not found for this tenant

  /settings/logo:
    post:
      operationId: uploadLogo
      tags: [settings]
      summary: Upload tenant logo as base64 (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoUpload"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSettings"

  /users:
    get:
      operationId: getUsers
      tags: [users]
      summary: List all users in the tenant (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /lifts/latest:
    get:
      operationId: getLatestLifts
      tags: [lifts]
      summary: Get latest snapshot for all lifts
      description: Returns the most recent extraction snapshot per lift for the given date. If extraction is provided, pins to that specific extraction time.
      parameters:
        - name: season
          in: query
          required: false
          schema:
            type: string
          description: Season filter e.g. "2024-2025"
        - name: date
          in: query
          required: false
          schema:
            type: string
          description: Date filter in YYYY-MM-DD format, defaults to today
        - name: extraction
          in: query
          required: false
          schema:
            type: string
          description: Specific extraction time (dupd value e.g. '20211219230000'). If omitted returns latest per lift.
      responses:
        "200":
          description: List of latest lift snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiftSnapshot"

  /lifts/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary totals
      description: Returns aggregated totals for the dashboard
      parameters:
        - name: season
          in: query
          required: false
          schema:
            type: string
        - name: date
          in: query
          required: false
          schema:
            type: string
        - name: extraction
          in: query
          required: false
          schema:
            type: string
          description: Pin to a specific extraction time (dupd value)
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /lifts/period-comparison:
    get:
      operationId: getPeriodComparison
      tags: [dashboard]
      summary: Weekly and season-to-date first entries compared at equivalent season weekdays
      description: Uses nuin. Weeks begin Saturday and are aligned by the Saturday containing each configured season opening date. Historical days use only the 23:30 extraction. If the selected day has a final 23:30 extraction it is included regardless of the selected hour. Otherwise the day is included from 14:00 onwards; earlier extractions stop both periods at the previous equivalent day. Missing finals are reported, never replaced with partial history or fabricated zeros.
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: season
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 40 }
        - name: extraction
          in: query
          required: false
          schema: { type: string, pattern: '^\d{14}$' }
      responses:
        "200":
          description: Calendar-aligned comparisons and data coverage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeriodComparison" }
        "400":
          description: Invalid date or extraction
        "404":
          description: Season or selected extraction not found

  /lifts/first-entries-forecast:
    get:
      operationId: getFirstEntriesForecast
      tags: [dashboard]
      summary: Forecast end-of-day first entries at three extraction times
      description: Tenant-scoped estimates of the dashboard first-entry metric (nuin). Live mode is limited to today's Europe/Rome date before a closing extraction is available. Only admins may request verification mode for past or closed days. Training and rolling validation use only preceding dates.
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: season
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 40 }
        - name: extraction
          in: query
          required: false
          schema: { type: string, pattern: '^\d{14}$' }
          description: Selected dupd; later extractions must not influence forecasts.
        - name: mode
          in: query
          required: false
          schema: { type: string, enum: [live, verification] }
          description: Defaults to live. Verification is admin-only and permits historical or closed days, never future data.
      responses:
        "200":
          description: Forecasts, data coverage and chronological validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirstEntriesForecast" }
        "400":
          description: Invalid date, season or extraction
        "403":
          description: Verification mode requires an administrator
        "404":
          description: Selected extraction not found for this date and season

  /lifts/dates:
    get:
      operationId: getLiftDates
      tags: [lifts]
      summary: List all dates that have lift data
      description: Returns distinct dates (YYYY-MM-DD) ordered most recent first
      parameters:
        - name: season
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of date strings in YYYY-MM-DD format, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /lifts/extractions:
    get:
      operationId: getLiftExtractions
      tags: [lifts]
      summary: List available extraction times for a date
      description: Returns distinct dupd values (extraction timestamps) for a given date, ordered ascending
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
          description: Date in YYYY-MM-DD format, defaults to today
        - name: season
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of extraction time strings (dupd values)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /lifts/history:
    get:
      operationId: getLiftHistory
      tags: [lifts]
      summary: Get historical snapshots for a specific lift
      parameters:
        - name: ggnr
          in: query
          required: true
          schema:
            type: integer
        - name: season
          in: query
          required: false
          schema:
            type: string
        - name: date
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of snapshots for this lift on the given date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiftSnapshot"
        "404":
          description: Lift not found

  /lifts/sync:
    post:
      operationId: syncLifts
      tags: [lifts]
      summary: Push extraction data from on-site script
      description: Receives a batch of lift snapshots from the scheduled extraction script
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncInput"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "401":
          description: Unauthorized

  /lifts/period:
    get:
      operationId: getLiftsPeriod
      tags: [lifts]
      summary: Get aggregated lift stats for a date range
      description: Returns per-lift cumulative totals and an overall summary for the given date range. Each lift's daily latest snapshot is summed across the period.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
          description: Start date in YYYY-MM-DD format
        - name: to
          in: query
          required: true
          schema:
            type: string
          description: End date in YYYY-MM-DD format (inclusive)
        - name: season
          in: query
          required: false
          schema:
            type: string
          description: Season filter e.g. "2024-2025"
      responses:
        "200":
          description: Period aggregated data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodResult"
        "400":
          description: Invalid parameters

  /seasons:
    get:
      operationId: getSeasons
      tags: [lifts]
      summary: List available seasons
      responses:
        "200":
          description: List of season strings
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /lifts/season-trend:
    get:
      operationId: getSeasonTrend
      tags: [lifts]
      summary: Get daily passage totals per season for comparison charts
      description: Returns daily aggregated totals per season so the client can draw multi-season comparison lines. Each season entry contains an array of daily data points ordered by date.
      parameters:
        - name: seasons
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated list of up to 20 distinct season strings e.g. "2023-2024,2024-2025". All requested seasons are returned in request order. Defaults to the two most recent seasons.
      responses:
        "200":
          description: Season trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeasonTrend"
        "400":
          description: Invalid season list or more than 20 distinct seasons requested

  /lifts/week-trend:
    get:
      operationId: getWeekTrend
      tags: [lifts]
      summary: Get weekly passage totals per season
      description: Returns weekly aggregated passages for one or more seasons. Weeks start on Saturday. Week 1 begins on the first Saturday on or before the first day of data in the season.
      parameters:
        - name: seasons
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated list of up to 20 distinct season identifiers. All requested seasons are returned in request order. Defaults to the two most recent seasons.
      responses:
        "200":
          description: Weekly trend data per season
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeekTrend"
        "400":
          description: Invalid season list or more than 20 distinct seasons requested

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    EmailSettings:
      type: object
      required: [senderEmail, senderName, hasPassword, configured, loginUrl, subject, body, defaultSubject, defaultBody, placeholders]
      properties:
        senderEmail: { type: string }
        senderName: { type: string }
        hasPassword: { type: boolean }
        configured: { type: boolean }
        loginUrl: { type: string }
        subject: { type: string }
        body: { type: string }
        defaultSubject: { type: string }
        defaultBody: { type: string }
        placeholders:
          type: array
          items: { type: string }
    EmailSettingsInput:
      type: object
      required: [senderName, loginUrl, subject, body]
      properties:
        senderName: { type: string, minLength: 1, maxLength: 120 }
        appPassword: { type: string, writeOnly: true, maxLength: 64 }
        loginUrl: { type: string, format: uri }
        subject: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 12000 }
    EmailPreviewInput:
      type: object
      required: [loginUrl, subject, body]
      properties:
        loginUrl: { type: string }
        subject: { type: string }
        body: { type: string }
        userId: { type: string }
    EmailPreview:
      type: object
      required: [subject, text, html, recipient, senderEmail]
      properties:
        subject: { type: string }
        text: { type: string }
        html: { type: string }
        recipient: { type: string }
        senderEmail: { type: string }
    CredentialEmailInput:
      type: object
      required: [confirmReset, expectedEmail]
      properties:
        confirmReset: { type: boolean }
        expectedEmail: { type: string, format: email }
    EmailReceipt:
      type: object
      required: [sentAt, recipient, messageId]
      properties:
        sentAt: { type: string, format: date-time }
        recipient: { type: string }
        messageId: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LiftSnapshot:
      type: object
      required: [id, ggnr, ggbz, nsoc, dtgg, dupd, eser]
      properties:
        id:
          type: integer
        idin:
          type: ["string", "null"]
        dupd:
          type: string
          description: Date and time of extraction
        dtgg:
          type: string
          description: Date of the data (ISO 8601)
        ggnr:
          type: integer
          description: Lift code
        ggbz:
          type: string
          description: Lift description/name
        nsoc:
          type: ["integer", "null"]
          description: Lift sort/group number
        npin:
          type: ["integer", "null"]
          description: Guests with first passage of the day
        npic:
          type: ["integer", "null"]
          description: Guests with second passage in different company
        nuin:
          type: ["integer", "null"]
          description: Number of guests on lifts at extraction time
        npas:
          type: ["integer", "null"]
          description: Total number of passages
        eser:
          type: string
          description: Season (e.g. "2024-2025")
        nomeSocieta:
          type: ["string", "null"]
          description: Company name
        descrGrp:
          type: ["string", "null"]
          description: Company group description
        idSocieta:
          type: ["integer", "null"]
          description: Company ID
        codgrp:
          type: ["string", "null"]
          description: Company group code

    DashboardSummary:
      type: object
      required: [date, season, totalPassages, totalGuests, totalLifts, activeLifts, lastSyncAt]
      properties:
        date:
          type: string
        season:
          type: string
        totalPassages:
          type: integer
          description: Sum of npas across all lifts
        totalGuests:
          type: integer
          description: Sum of nuin across all lifts
        totalLifts:
          type: integer
          description: Total number of lifts
        activeLifts:
          type: integer
          description: Lifts with at least one passage
        lastSyncAt:
          type: ["string", "null"]
          description: ISO timestamp of last data sync

    ForecastValidation:
      type: object
      required: [sampleDays, medianAbsolutePercentageError, meanAbsoluteError, intervalCoverage]
      properties:
        sampleDays: { type: integer }
        medianAbsolutePercentageError:
          type: ["number", "null"]
          description: Fraction, not percentage points; chronological out-of-sample errors.
        meanAbsoluteError: { type: ["number", "null"] }
        intervalCoverage:
          type: ["number", "null"]
          description: Fraction of held-out finals inside the indicative interval, calibrated on still earlier errors.

    FirstEntriesForecastPoint:
      type: object
      required: [slot, status, extraction, observedEntries, predictedTotal, lowerBound, upperBound, sampleDays, comparisonScope, confidence, validation]
      properties:
        slot: { type: string, enum: ["10:30", "11:30", "14:00"] }
        status:
          type: string
          enum: [ready, before_extraction, missing_extraction, incomplete_extraction, insufficient_history, insufficient_validation, no_data, zero_entries]
        extraction: { type: ["string", "null"] }
        observedEntries: { type: ["integer", "null"] }
        predictedTotal: { type: ["integer", "null"] }
        lowerBound: { type: ["integer", "null"] }
        upperBound: { type: ["integer", "null"] }
        sampleDays: { type: integer }
        comparisonScope: { type: string, enum: [similar_days, broader_history] }
        confidence: { type: string, enum: [unavailable, low, medium, high] }
        validation: { $ref: "#/components/schemas/ForecastValidation" }

    FirstEntriesForecast:
      type: object
      required: [date, season, metric, modelVersion, timeZone, availability, history, forecasts]
      properties:
        date: { type: string }
        season: { type: string }
        metric: { type: string, enum: [nuin] }
        modelVersion: { type: string }
        timeZone: { type: string, enum: [Europe/Rome] }
        availability:
          type: string
          enum: [live, verification, past_day, day_closed, future_day]
          description: Blocked states return no forecasts and do not calculate or validate the model.
        history:
          type: object
          required: [daysExamined, completeDays, fromDate, toDate]
          properties:
            daysExamined: { type: integer }
            completeDays: { type: integer }
            fromDate: { type: ["string", "null"] }
            toDate: { type: ["string", "null"] }
        forecasts:
          type: array
          items: { $ref: "#/components/schemas/FirstEntriesForecastPoint" }

    SyncInput:
      type: object
      required: [snapshots]
      properties:
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/SnapshotInput"

    SnapshotInput:
      type: object
      required: [dupd, dtgg, ggnr, ggbz, eser]
      properties:
        idin:
          type: ["string", "null"]
        dupd:
          type: string
        dtgg:
          type: string
        ggnr:
          type: integer
        ggbz:
          type: string
        nsoc:
          type: ["integer", "null"]
        npin:
          type: ["integer", "null"]
        npic:
          type: ["integer", "null"]
        nuin:
          type: ["integer", "null"]
        npas:
          type: ["integer", "null"]
        eser:
          type: string
        nome_societa:
          type: ["string", "null"]
          description: Company name
        descr_grp:
          type: ["string", "null"]
          description: Company group description
        id_societa:
          type: ["string", "null"]
          description: Company ID
        codgrp:
          type: ["string", "null"]
          description: Company group code

    SyncResult:
      type: object
      required: [inserted, updated, total]
      properties:
        inserted:
          type: integer
        updated:
          type: integer
        total:
          type: integer
        message:
          type: ["string", "null"]

    PeriodLiftRow:
      type: object
      required: [ggnr, ggbz, totalPassages, totalGuests, totalFirstPassages, activeDays]
      properties:
        ggnr:
          type: integer
          description: Lift code
        ggbz:
          type: string
          description: Lift name
        totalPassages:
          type: integer
          description: Sum of daily-latest npas across the period
        totalGuests:
          type: integer
          description: Sum of daily-latest nuin across the period
        totalFirstPassages:
          type: integer
          description: Sum of daily-latest npin across the period
        activeDays:
          type: integer
        nsoc:
          type: ["integer", "null"]
          description: Company/group sort number
        descrGrp:
          type: ["string", "null"]
          description: Group name
        nomeSocieta:
          type: ["string", "null"]
          description: Company name

    SeasonTrendPoint:
      type: object
      required: [date, dayIndex, totalPassages, totalGuests, totalFirstPassages]
      properties:
        date:
          type: string
          description: Date in YYYY-MM-DD format
        dayIndex:
          type: integer
          description: 1-based index of this day within the season (for aligning seasons on the x-axis)
        totalPassages:
          type: integer
          description: Total passages across all lifts on this date
        totalGuests:
          type: integer
          description: Total guests on lifts across all lifts on this date
        totalFirstPassages:
          type: integer
          description: Sum of npin (first daily entries) across all lifts on this date

    SeasonTrend:
      type: object
      required: [season, data]
      properties:
        season:
          type: string
          description: Season identifier e.g. "2024-2025"
        data:
          type: array
          items:
            $ref: "#/components/schemas/SeasonTrendPoint"
          description: Daily data points ordered by date

    WeekTrendPoint:
      type: object
      required: [weekNumber, fromDate, toDate, totalPassages, totalGuests, totalFirstPassages]
      properties:
        weekNumber:
          type: integer
          description: 1-based week number within the season (weeks start on Saturday)
        fromDate:
          type: string
          description: First date in this week that has data (YYYY-MM-DD)
        toDate:
          type: string
          description: Last date in this week that has data (YYYY-MM-DD)
        totalPassages:
          type: integer
          description: Total passages across all lifts during this week
        totalGuests:
          type: integer
          description: Total guests on lifts across all lifts during this week
        totalFirstPassages:
          type: integer
          description: Sum of npin (first daily entries) across all lifts during this week

    SeasonStartInput:
      type: object
      required: [startDate]
      properties:
        startDate:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Real calendar date; null clears the configuration

    SeasonStart:
      type: object
      required: [season, startDate, firstDataDate, suggestedStartDate]
      properties:
        season: { type: string }
        startDate: { type: ["string", "null"] }
        firstDataDate: { type: ["string", "null"] }
        suggestedStartDate:
          type: ["string", "null"]
          description: Saturday on or before first recorded day; suggestion only, never silently saved

    PeriodComparisonValue:
      type: object
      required: [currentTotal, previousTotal, changePercent, currentFromDate, currentToDate, previousFromDate, previousToDate, missingCurrentDays, missingPreviousDays]
      properties:
        currentTotal: { type: ["integer", "null"] }
        previousTotal: { type: ["integer", "null"] }
        changePercent: { type: ["number", "null"] }
        currentFromDate: { type: ["string", "null"] }
        currentToDate: { type: ["string", "null"] }
        previousFromDate: { type: ["string", "null"] }
        previousToDate: { type: ["string", "null"] }
        missingCurrentDays:
          type: array
          items: { type: string }
        missingPreviousDays:
          type: array
          items: { type: string }

    PeriodComparison:
      type: object
      required: [date, season, previousSeason, status, includedSelectedDay, sourceExtraction, currentSeasonStartDate, previousSeasonStartDate, missingConfiguration, weekly, progressive]
      properties:
        date: { type: string }
        season: { type: string }
        previousSeason: { type: ["string", "null"] }
        status:
          type: string
          enum: [ready, configuration_required, before_season, no_data]
        includedSelectedDay: { type: boolean }
        sourceExtraction: { type: ["string", "null"] }
        currentSeasonStartDate: { type: ["string", "null"] }
        previousSeasonStartDate: { type: ["string", "null"] }
        missingConfiguration:
          type: array
          items: { type: string }
        weekly: { $ref: "#/components/schemas/PeriodComparisonValue" }
        progressive: { $ref: "#/components/schemas/PeriodComparisonValue" }

    TenantSettings:
      type: object
      required: [tenantId, colors, maxSeasons]
      properties:
        tenantId:
          type: string
        logoBase64:
          type: ["string", "null"]
        primaryColor:
          type: ["string", "null"]
          description: Hex color used for primary UI elements (e.g. #0070BA)
        colors:
          type: array
          items:
            type: string
          maxItems: 10
          description: Chart series colors (passages, first entries, presences per season)
        maxSeasons:
          type: integer
          minimum: 1
          maximum: 20

    SettingsPatch:
      type: object
      properties:
        primaryColor:
          type: ["string", "null"]
          description: Hex color used for primary UI elements (e.g. #0070BA)
        colors:
          type: array
          items:
            type: string
          maxItems: 10
          description: Chart series colors
        maxSeasons:
          type: integer
          minimum: 1
          maximum: 20

    LogoUpload:
      type: object
      required: [logoBase64]
      properties:
        logoBase64:
          type: ["string", "null"]

    WeekTrend:
      type: object
      required: [season, weeks]
      properties:
        season:
          type: string
          description: Season identifier e.g. "2024-2025"
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/WeekTrendPoint"
          description: Weekly data points ordered by week number

    ChangeOwnPasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
    AuthUser:
      type: object
      required: [id, email, name, role, tenantId, mustChangePassword]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, operator, viewer]
        tenantId:
          type: string
        mustChangePassword:
          type: boolean
    User:
      type: object
      required: [id, email, name, role, isActive, mustChangePassword]
      properties:
        credentialsSentAt:
          type: ["string", "null"]
          format: date-time
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, operator, viewer]
        isActive:
          type: boolean
        mustChangePassword:
          type: boolean
        createdAt:
          type: ["string", "null"]

    CreateUserRequest:
      type: object
      required: [email, name, password]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, operator, viewer]
        mustChangePassword:
          type: boolean
          default: false

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum: [admin, operator, viewer]
        password:
          type: string
        isActive:
          type: boolean
        mustChangePassword:
          type: boolean

    PeriodResult:
      type: object
      required: [from, to, totalPassages, totalGuests, activeDays, lifts]
      properties:
        from:
          type: string
          description: Start date YYYY-MM-DD
        to:
          type: string
          description: End date YYYY-MM-DD
        season:
          type: ["string", "null"]
        totalPassages:
          type: integer
          description: Sum of all lift passages in the period
        totalGuests:
          type: integer
          description: Sum of all guest counts in the period
        activeDays:
          type: integer
          description: Number of distinct days that had any data
        busiestDay:
          type: ["string", "null"]
          description: YYYY-MM-DD date with the most passages
        busiestLift:
          type: ["string", "null"]
          description: Name of the lift with the most passages
        lifts:
          type: array
          items:
            $ref: "#/components/schemas/PeriodLiftRow"
          description: Per-lift aggregated totals, sorted by total passages descending
